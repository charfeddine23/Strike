name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Build Environment
        run: |
          # 1. Ensure .env exists for Secrets Gradle plugin
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # 2. Restore permanent release keystore from base64 if needed
          if [ -f "my-upload-key.jks.base64" ] && [ ! -s "my-upload-key.jks" ]; then
            echo "Restoring my-upload-key.jks from base64..."
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks 2>/dev/null || true
          fi
          if [ -f "release.jks.base64" ] && [ ! -s "release.jks" ]; then
            echo "Restoring release.jks from base64..."
            base64 -d release.jks.base64 > release.jks 2>/dev/null || true
          fi
          if [ -f "my-upload-key.jks" ] && [ ! -f "release.jks" ]; then
            cp my-upload-key.jks release.jks
          fi

          # 3. Restore debug.keystore from base64 if needed
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 4. Generate fallback release keystore if missing
          if [ ! -f "my-upload-key.jks" ] || [ ! -s "my-upload-key.jks" ]; then
            echo "Generating fallback my-upload-key.jks..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass strikepulse2026 -alias upload -keypass strikepulse2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StrikePulse,OU=Development,O=Charfeddine,L=Algiers,ST=Algiers,C=DZ"
          fi

          # 5. Generate fallback debug.keystore if missing or empty
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 6. Ensure Gradle wrapper is executable
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Determine Dynamic Version & Tag
        id: versioning
        run: |
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_NAME="1.0.${{ github.run_number }}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="StrikePulse ${TAG_NAME}"
          else
            TAG_NAME="v${VERSION_NAME}"
            RELEASE_TITLE="StrikePulse v${VERSION_NAME} (Build #${{ github.run_number }})"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK with Gradle
        run: |
          export KEYSTORE_PATH="${KEYSTORE_PATH:-$GITHUB_WORKSPACE/my-upload-key.jks}"
          export STORE_PASSWORD="${STORE_PASSWORD:-strikepulse2026}"
          export KEY_PASSWORD="${KEY_PASSWORD:-strikepulse2026}"
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.versioning.outputs.version_name }} -Djava.awt.headless=true --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'strikepulse2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'strikepulse2026' }}

      - name: Locate and Rename APK
        id: find_apk
        run: |
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            echo "Warning: No release APK found, checking debug output..."
            APK_RAW=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_RAW" ]; then
            echo "::error::No APK file generated in app/build/outputs/apk!"
            exit 1
          fi

          TAG_NAME="${{ steps.versioning.outputs.tag_name }}"
          RELEASE_APK="StrikePulse-${TAG_NAME}.apk"
          cp "$APK_RAW" "$RELEASE_APK"

          echo "Found APK: $APK_RAW"
          echo "Renamed for release: $RELEASE_APK"
          echo "apk_path=${RELEASE_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strikepulse-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
      - name: Prune Old GitHub Releases & Tags (Keep Latest Only)
        run: |
          echo "Scanning for previous releases to purge..."
          EXISTING_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true)
          for old_tag in $EXISTING_RELEASES; do
            echo "Deleting previous release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done
          echo "Previous releases cleaned up. Only the latest release will be kept."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          body: |
            ## 🚀 StrikePulse Automated Release - ${{ steps.versioning.outputs.tag_name }}

            ### 📦 App Details
            - **Version**: `v${{ steps.versioning.outputs.version_name }}`
            - **Build Code**: `#${{ github.run_number }}`
            - **Developer**: Developed by Charfeddine Kahlessenane
            - **Commit**: `${{ steps.versioning.outputs.commit_short }}` (`${{ github.sha }}`)
            - **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')

            ### ✨ Features Included
            - 📊 **Dynamic Auto-calculations**: Size (Length × Width), Boost, and Score (Boost × Strike).
            - ⚡ **Dedicated Strike Screen & Real-Time Tracking**: Instant strike increment with date, time, and year recorded to Room DB.
            - 📈 **Yearly Strike Dashboard**: Statistics per year with interactive timeline.
            - ⚖️ **Smart Comparison Page**: Side-by-side analytical comparison between two individuals.
            - 🔒 **Security Pattern Lock (Schéma 3×3)**: App lock upon launch and pattern management in Settings.
            - 🎨 **Liquid Glass UI & System Auto Theme**: Automatic dark/light theme switching based on device setting.
            - 📥 **Past Strike Logging**: Historical strike entry per year.

            ### 📲 Installation
            1. Download the **`${{ steps.find_apk.outputs.apk_path }}`** file below.
            2. Open the APK on your Android device and tap **Install**.
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
